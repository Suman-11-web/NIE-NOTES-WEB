{% extends 'base.html' %}
{% block content %}
<div class="w-full max-w-3xl mx-auto opacity-0 animate-fade-in px-2 sm:px-6">
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 overflow-hidden relative w-full">
        <div class="h-32 sm:h-48 bg-gradient-to-br from-slate-800 to-slate-900 relative overflow-hidden">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-30"></div>
        </div>

        <div class="relative flex justify-center -mt-16 sm:-mt-20 z-10">
            <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full bg-white border-4 sm:border-8 border-slate-50 shadow-lg flex items-center justify-center text-5xl sm:text-6xl font-extrabold text-primary">
                {{ session.get('student_name')[0] }}
            </div>
        </div>

        <div class="text-center px-6 pt-4 pb-10 w-full">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-1">{{ session.get('student_name') }}</h2>
            <p class="text-xs sm:text-sm font-bold text-slate-400 uppercase tracking-wider mb-6">NIE Student</p>

            <div class="flex flex-wrap items-center justify-center gap-3 mb-8 w-full">
                <div class="flex items-center gap-2 px-4 py-2 bg-slate-100 text-slate-700 font-extrabold text-sm rounded-xl">
                    <i data-lucide="book-marked" class="w-4 h-4"></i> {{ session.get('student_course') }}
                </div>
                <a href="{{ url_for('student_logout') }}" class="flex items-center gap-2 px-4 py-2 bg-rose-50 text-rose-600 font-extrabold text-sm rounded-xl hover:bg-rose-500 hover:text-white transition-all shadow-sm group">
                    <i data-lucide="log-out" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> Logout
                </a>
            </div>

            <div class="border-t border-slate-100 pt-8 w-full max-w-sm mx-auto">
                <div class="flex flex-col items-center justify-center p-6 bg-slate-50 rounded-3xl border border-slate-200">
                    <div class="w-14 h-14 bg-primary text-white rounded-2xl flex items-center justify-center mb-3 shadow-md shadow-blue-500/20">
                        <i data-lucide="award" class="w-7 h-7"></i>
                    </div>
                    <span class="text-4xl font-extrabold text-slate-900 mb-1">{{ stats['total_notes'] }}</span>
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Notes Contributed</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
