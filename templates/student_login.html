{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto; background: white; padding: 2.5rem; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.05);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <i data-lucide="graduation-cap" style="width: 48px; height: 48px; color: var(--primary);"></i>
        <h2 style="margin-top: 10px;">Student Access</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Enter your details to start sharing notes. No account required!</p>
    </div>

    <form method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
        <div>
            <label style="font-size: 0.8rem; font-weight: 700;">Your Full Name</label>
            <input type="text" name="name" placeholder="e.g. Rahul S." required style="width: 100%; padding: 0.8rem; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 0.3rem;">
        </div>
        <div>
            <label style="font-size: 0.8rem; font-weight: 700;">Your Branch / Course</label>
            <input type="text" name="course" placeholder="e.g. BCA 5th Sem" required style="width: 100%; padding: 0.8rem; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 0.3rem;">
        </div>
        <button type="submit" class="btn-primary-action" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Continue</button>
    </form>
</div>
{% endblock %}
